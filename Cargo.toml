[package]
name = "oat-agents"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[[bin]]
name = "oat-agents"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
k8s-openapi = { version = "0.26", features = ["v1_33"] }
kube = { version = "2.0.1", default-features = false, features = ["client", "rustls-tls", "ws"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "io-util", "time"] }
toml = "1.1.6"

[dev-dependencies]
tempfile = "3"
