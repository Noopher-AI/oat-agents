<svg xmlns="http://www.w3.org/2000/svg" width="960" height="476" viewBox="0 0 960 476" role="img" aria-label="Where oat-agents sits: Multica, Orca and herdr have you hand out the work, from a platform, a desktop app or a terminal multiplexer; oat-agents has a coordinator agent hand out the work, from a single CLI.">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace; }
    .axis { stroke: #30363d; stroke-width: 1.5; }
    .ring { transform-box: fill-box; transform-origin: center; animation: ring 2.4s ease-out infinite; }
    @keyframes ring { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(3.2); opacity: 0; } }
    .zone { animation: zone 4s ease-in-out infinite; }
    @keyframes zone { 50% { opacity: .55; } }
  
    .cap{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:20px}
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10z" fill="#484f58"/>
    </marker>
    <linearGradient id="z" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d2a8ff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#d2a8ff" stop-opacity=".04"/>
    </linearGradient>
  </defs>

  <rect width="960" height="476" rx="16" fill="#0d1117"/>
  

  <!-- quadrant highlight -->
  <rect class="zone" x="498" y="222" width="420" height="138" rx="12" fill="url(#z)" stroke="#d2a8ff" stroke-opacity=".35" stroke-dasharray="4 5"/>

  <!-- axes -->
  <line class="axis" x1="120" y1="360" x2="920" y2="360" marker-end="url(#arr)"/>
  <line class="axis" x1="120" y1="360" x2="120" y2="40" marker-end="url(#arr)"/>
  <line x1="498" y1="44" x2="498" y2="360" stroke="#21262d" stroke-dasharray="3 6"/>
  <text x="310" y="390" font-size="13" fill="#8b949e" text-anchor="middle">you hand out the work</text>
  <text x="708" y="390" font-size="13" fill="#8b949e" text-anchor="middle">an agent hands out the work</text>
  <text x="520" y="410" font-size="11" fill="#6e7681" text-anchor="middle" class="mono">WHO SPLITS THE WORK →</text>
  <text x="96" y="84" font-size="12" fill="#8b949e" text-anchor="end">platform</text>
  <text x="96" y="100" font-size="11" fill="#6e7681" text-anchor="end">server + DB</text>
  <text x="96" y="204" font-size="12" fill="#8b949e" text-anchor="end">desktop</text>
  <text x="96" y="220" font-size="11" fill="#6e7681" text-anchor="end">app</text>
  <text x="96" y="318" font-size="12" fill="#8b949e" text-anchor="end">one</text>
  <text x="96" y="334" font-size="11" fill="#6e7681" text-anchor="end">binary</text>
  <text x="34" y="210" font-size="11" fill="#6e7681" text-anchor="middle" class="mono" transform="rotate(-90 34 210)">WHAT YOU RUN →</text>

  <!-- Multica -->
  <circle cx="200" cy="92" r="9" fill="#484f58"/>
  <text x="220" y="88" font-size="16" font-weight="700" fill="#c9d1d9">Multica</text>
  <text x="220" y="107" font-size="12" fill="#8b949e">assign issues to agent teammates on a board</text>
  <text x="220" y="123" font-size="11" fill="#6e7681" class="mono">Go server · PostgreSQL · web/desktop/mobile · daemon</text>

  <!-- Orca -->
  <circle cx="200" cy="212" r="9" fill="#484f58"/>
  <text x="220" y="208" font-size="16" font-weight="700" fill="#c9d1d9">Orca</text>
  <text x="220" y="227" font-size="12" fill="#8b949e">fan prompts across worktrees, compare, merge</text>
  <text x="220" y="243" font-size="11" fill="#6e7681" class="mono">Electron desktop app</text>

  <!-- herdr -->
  <circle cx="200" cy="316" r="9" fill="#484f58"/>
  <text x="220" y="312" font-size="16" font-weight="700" fill="#c9d1d9">herdr</text>
  <text x="220" y="331" font-size="12" fill="#8b949e">an agent-aware terminal multiplexer</text>
  <text x="220" y="347" font-size="11" fill="#6e7681" class="mono">one Rust binary · you herd the panes</text>

  <!-- oat-agents -->
  <circle class="ring" cx="560" cy="286" r="10" fill="none" stroke="#d2a8ff" stroke-width="2"/>
  <circle cx="560" cy="286" r="10" fill="#d2a8ff"/>
  <text x="582" y="274" font-size="20" font-weight="700" fill="#e6edf3" class="mono">oat-agents</text>
  <text x="582" y="296" font-size="13" fill="#d2a8ff">oat-meta splits one Big Plan across roles</text>
  <text x="582" y="314" font-size="12" fill="#8b949e">you answer its questions and merge the result</text>
  <text x="582" y="332" font-size="11" fill="#6e7681" class="mono">one Rust CLI · git · tmux · plain files</text>
  <!-- caption -->
  <path d="M0 420H960V460Q960 476 944 476H16Q0 476 0 460Z" fill="#161b22"/><rect x="0" y="420" width="960" height="1" fill="#30363d"/><rect x=".5" y=".5" width="959" height="475" rx="16" fill="none" stroke="#30363d"/>
  <text class="cap" x="480" y="456" fill="#c9d1d9" text-anchor="middle">Elsewhere you decide who does what. Here a coordinator agent does, and asks when it can't.</text>
</svg>
