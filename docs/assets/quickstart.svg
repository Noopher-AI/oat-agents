<svg xmlns="http://www.w3.org/2000/svg" width="884" height="468" viewBox="0 0 884 468" role="img" aria-label="Getting started: install.sh, oat-agents init, plugin trust, meta fire, then the live view."><style>text{font:14px ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;white-space:pre}.cap{font:20px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.cur{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}@keyframes s0{0%,0.00%{opacity:0}0.00%,99%{opacity:1}100%{opacity:0}}.s0{animation:s0 18.0s infinite}@keyframes o0{0%,7.78%{opacity:0}7.79%,99%{opacity:1}100%{opacity:0}}.o0{animation:o0 18.0s infinite}@keyframes k0{0%,0.00%{transform:translateX(0)}7.78%{transform:translateX(730.8px);opacity:1}7.79%,100%{transform:translateX(730.8px);opacity:0}}.k0{animation:k0 18.0s infinite}@keyframes c0{0%,0.00%{opacity:0}0.00%,22.21%{opacity:1}22.22%,100%{opacity:0}}.c0{animation:c0 18.0s infinite;opacity:0}@keyframes s1{0%,22.21%{opacity:0}22.22%,99%{opacity:1}100%{opacity:0}}.s1{animation:s1 18.0s infinite}@keyframes o1{0%,30.00%{opacity:0}30.01%,99%{opacity:1}100%{opacity:0}}.o1{animation:o1 18.0s infinite}@keyframes k1{0%,22.22%{transform:translateX(0)}30.00%{transform:translateX(352.8px);opacity:1}30.01%,100%{transform:translateX(352.8px);opacity:0}}.k1{animation:k1 18.0s infinite}@keyframes c1{0%,22.21%{opacity:0}22.22%,37.77%{opacity:1}37.78%,100%{opacity:0}}.c1{animation:c1 18.0s infinite;opacity:0}@keyframes s2{0%,37.77%{opacity:0}37.78%,99%{opacity:1}100%{opacity:0}}.s2{animation:s2 18.0s infinite}@keyframes o2{0%,45.56%{opacity:0}45.57%,99%{opacity:1}100%{opacity:0}}.o2{animation:o2 18.0s infinite}@keyframes k2{0%,37.78%{transform:translateX(0)}45.56%{transform:translateX(394.8px);opacity:1}45.57%,100%{transform:translateX(394.8px);opacity:0}}.k2{animation:k2 18.0s infinite}@keyframes c2{0%,37.77%{opacity:0}37.78%,53.32%{opacity:1}53.33%,100%{opacity:0}}.c2{animation:c2 18.0s infinite;opacity:0}@keyframes s3{0%,53.32%{opacity:0}53.33%,99%{opacity:1}100%{opacity:0}}.s3{animation:s3 18.0s infinite}@keyframes o3{0%,61.11%{opacity:0}61.12%,99%{opacity:1}100%{opacity:0}}.o3{animation:o3 18.0s infinite}@keyframes k3{0%,53.33%{transform:translateX(0)}61.11%{transform:translateX(714.0px);opacity:1}61.12%,100%{transform:translateX(714.0px);opacity:0}}.k3{animation:k3 18.0s infinite}@keyframes c3{0%,53.32%{opacity:0}53.33%,72.21%{opacity:1}72.22%,100%{opacity:0}}.c3{animation:c3 18.0s infinite;opacity:0}@keyframes s4{0%,72.21%{opacity:0}72.22%,99%{opacity:1}100%{opacity:0}}.s4{animation:s4 18.0s infinite}@keyframes o4{0%,77.00%{opacity:0}77.01%,99%{opacity:1}100%{opacity:0}}.o4{animation:o4 18.0s infinite}@keyframes k4{0%,72.22%{transform:translateX(0)}77.00%{transform:translateX(117.6px);opacity:1}77.01%,100%{transform:translateX(117.6px);opacity:0}}.k4{animation:k4 18.0s infinite}@keyframes c4{0%,72.21%{opacity:0}72.22%,98.99%{opacity:1}99.00%,100%{opacity:0}}.c4{animation:c4 18.0s infinite;opacity:0}</style><rect width="884" height="468" rx="12" fill="#0d1117"/><path d="M0 412H884V456Q884 468 872 468H12Q0 468 0 456Z" fill="#161b22"/><rect y="412" width="884" height="1" fill="#30363d"/><rect x=".5" y=".5" width="883" height="467" rx="12" fill="none" stroke="#30363d"/><circle cx="22" cy="18" r="6" fill="#ff5f57"/><circle cx="42" cy="18" r="6" fill="#febc2e"/><circle cx="62" cy="18" r="6" fill="#28c840"/><text x="442" y="23" fill="#6e7681" text-anchor="middle" style="font-size:12px">getting started</text><g class="s0" opacity="0"><text x="22" y="52" fill="#d2a8ff">$</text><text x="38.8" y="52" fill="#e6edf3">curl -fsSL https://raw.githubusercontent.com/Noopher-AI/oat-agents/main/install.sh | sh</text><rect class="k0" x="38.8" y="37" width="742.8" height="20" fill="#0d1117"/><g class="o0"><text x="22" y="72" fill="#6e7681">Fetching oat-agents (main) from https://github.com/Noopher-AI/oat-agents.git...</text><text x="22" y="92" fill="#6e7681">Building oat-agents (cargo build --release --locked)...</text><text x="22" y="112" fill="#3fb950">Installed oat-agents to ~/.local/bin/oat-agents</text><text x="22" y="132" fill="#3fb950">Installed the oat-agents-cli skill to ~/.agents/skills/oat-agents-cli/SKILL.md</text></g></g><text class="cap c0" x="442" y="448" fill="#c9d1d9" text-anchor="middle">① One command, no clone: the binary plus a skill that teaches your agent to drive it</text><g class="s1" opacity="0"><text x="22" y="172" fill="#d2a8ff">$</text><text x="38.8" y="172" fill="#e6edf3">cd ~/src/webapp &amp;&amp; oat-agents init --local</text><rect class="k1" x="38.8" y="157" width="364.8" height="20" fill="#0d1117"/><g class="o1"><text x="22" y="192" fill="#c9d1d9">{ &quot;plugins&quot;: [ { &quot;name&quot;: &quot;example&quot;, &quot;source&quot;: &quot;embedded&quot; } ], &quot;local&quot;: true, … }</text></g></g><text class="cap c1" x="442" y="448" fill="#c9d1d9" text-anchor="middle">② Pin the repository&#x27;s plugins; with no flags, the built-in example team</text><g class="s2" opacity="0"><text x="22" y="232" fill="#d2a8ff">$</text><text x="38.8" y="232" fill="#e6edf3">oat-agents plugin trust embedded --name example</text><rect class="k2" x="38.8" y="217" width="406.8" height="20" fill="#0d1117"/><g class="o2"><text x="22" y="252" fill="#c9d1d9">{ &quot;source&quot;: &quot;embedded&quot;, &quot;trusted&quot;: true, &quot;version&quot;: &quot;0.1.0&quot; }</text></g></g><text class="cap c2" x="442" y="448" fill="#c9d1d9" text-anchor="middle">③ Trust each plugin once per machine: its instructions steer your agents</text><g class="s3" opacity="0"><text x="22" y="292" fill="#d2a8ff">$</text><text x="38.8" y="292" fill="#e6edf3">oat-agents meta fire --name rate-limit-login --prompt &quot;Rate-limit the login endpoint&quot;</text><rect class="k3" x="38.8" y="277" width="726.0" height="20" fill="#0d1117"/><g class="o3"><text x="22" y="312" fill="#c9d1d9">{ &quot;run_id&quot;: &quot;rate-limit-login&quot;, &quot;branch&quot;: &quot;oat/rate-limit-login/meta&quot;, &quot;backend&quot;: &quot;claude&quot;, … }</text></g></g><text class="cap c3" x="442" y="448" fill="#c9d1d9" text-anchor="middle">④ Fire a Run: oat-meta starts in its own worktree and tmux session</text><g class="s4" opacity="0"><text x="22" y="352" fill="#d2a8ff">$</text><text x="38.8" y="352" fill="#e6edf3">oat-agents tui</text><rect class="k4" x="38.8" y="337" width="129.6" height="20" fill="#0d1117"/><g class="o4"><text x="22" y="372" fill="#39c5cf">▸ opening the live view…</text></g></g><text class="cap c4" x="442" y="448" fill="#c9d1d9" text-anchor="middle">⑤ Watch every agent, answer oat-meta&#x27;s questions, type into any session</text></svg>
