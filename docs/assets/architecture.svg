<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-label="A plugin is a directory of Markdown and TOML: core/oat-meta-instruction.md says how the meta-agent splits the work and when it asks you, and each directory under roles/ is one kind of member agent. The core launches that team the same way for every plugin: worktrees, tmux sessions, the Run inbox, the workflow log, pods and the live view."><style>text{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;white-space:pre;font-size:13px}.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.h{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:17px;font-weight:600}.n{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:15px}</style><rect width="960" height="500" rx="12" fill="#0d1117"/><rect x=".5" y=".5" width="959" height="499" rx="12" fill="none" stroke="#30363d"/><text x="36.0" y="44.0" fill="#e6edf3" class="h">Your plugin: a directory</text><rect x="24" y="60" width="456" height="330" rx="8" fill="#161b22" stroke="#30363d"/><text x="44.0" y="88.0" fill="#e6edf3">plugins/your-team/</text><text x="44.0" y="113.0" fill="#c9d1d9">├─ oat-plugin.toml</text><text x="44.0" y="138.0" fill="#c9d1d9">├─ core/</text><text x="44.0" y="163.0" fill="#d2a8ff">│  └─ oat-meta-instruction.md</text><text x="44.0" y="188.0" fill="#6e7681">│        how to split the work, when to ask you</text><text x="44.0" y="213.0" fill="#c9d1d9">├─ roles/</text><text x="44.0" y="238.0" fill="#39c5cf">│  ├─ planner/</text><text x="464.0" y="238.0" fill="#6e7681" text-anchor="end">role.toml + instructions.md</text><text x="44.0" y="263.0" fill="#3fb950">│  ├─ worker/</text><text x="464.0" y="263.0" fill="#6e7681" text-anchor="end">max_concurrent = 4</text><text x="44.0" y="288.0" fill="#e3b341">│  ├─ reviewer/</text><text x="464.0" y="288.0" fill="#6e7681" text-anchor="end">exec_environment = true</text><text x="44.0" y="313.0" fill="#58a6ff">│  └─ security-auditor/</text><text x="464.0" y="313.0" fill="#6e7681" text-anchor="end">a new role: a new directory</text><text x="44.0" y="338.0" fill="#c9d1d9">└─ skills/</text><text x="44.0" y="363.0" fill="#c9d1d9">   └─ committing/SKILL.md</text><text x="464.0" y="363.0" fill="#6e7681" text-anchor="end">know-how a role may load</text><path d="M488 225H516" stroke="#8b949e" stroke-width="2" fill="none"/><path d="M516 219L526 225L516 231Z" fill="#8b949e"/><text x="548.0" y="44.0" fill="#e6edf3" class="h">The team it launches</text><rect x="536" y="60" width="400" height="330" rx="8" fill="#161b22" stroke="#30363d"/><rect x="644" y="80" width="184" height="44" rx="8" fill="#0d1117" stroke="#d2a8ff"/><text x="736.0" y="99.0" fill="#d2a8ff" font-weight="700" text-anchor="middle">meta-agent</text><text x="736.0" y="116.0" fill="#6e7681" text-anchor="middle" style="font-size:11px">splits the goal, reads mail</text><path d="M736 124V294" stroke="#30363d" stroke-width="1.5" fill="none"/><path d="M736 202H726" stroke="#30363d" stroke-width="1.5" fill="none"/><rect x="556" y="172" width="170" height="60" rx="8" fill="#0d1117" stroke="#39c5cf"/><text x="641.0" y="194.0" fill="#39c5cf" font-weight="700" text-anchor="middle">planner ×1</text><text x="641.0" y="214.0" fill="#6e7681" text-anchor="middle" style="font-size:11px">⎇ worktree · ▣ session</text><path d="M736 202H746" stroke="#30363d" stroke-width="1.5" fill="none"/><rect x="746" y="172" width="170" height="60" rx="8" fill="#0d1117" stroke="#3fb950"/><text x="831.0" y="194.0" fill="#3fb950" font-weight="700" text-anchor="middle">worker ×4</text><text x="831.0" y="214.0" fill="#6e7681" text-anchor="middle" style="font-size:11px">⎇ worktree · ▣ session</text><path d="M736 294H726" stroke="#30363d" stroke-width="1.5" fill="none"/><rect x="556" y="264" width="170" height="60" rx="8" fill="#0d1117" stroke="#e3b341"/><text x="641.0" y="286.0" fill="#e3b341" font-weight="700" text-anchor="middle">reviewer ×1</text><text x="641.0" y="306.0" fill="#6e7681" text-anchor="middle" style="font-size:11px">⎇ worktree · ▣ session</text><path d="M736 294H746" stroke="#30363d" stroke-width="1.5" fill="none"/><rect x="746" y="264" width="170" height="60" rx="8" fill="#0d1117" stroke="#58a6ff"/><text x="831.0" y="286.0" fill="#58a6ff" font-weight="700" text-anchor="middle">security-auditor ×1</text><text x="831.0" y="306.0" fill="#6e7681" text-anchor="middle" style="font-size:11px">⎇ worktree · ▣ session</text><text x="736.0" y="376.0" fill="#6e7681" text-anchor="middle" style="font-size:11px">member agents, each on the backend its role names</text><rect x="24" y="408" width="912" height="72" rx="8" fill="#161b22" stroke="#30363d"/><text x="44.0" y="436.0" fill="#e6edf3" class="s" font-weight="700" style="font-size:14px">The core, the same for every team</text><text x="44.0" y="462.0" fill="#8b949e">▸ launch  ⎇ worktrees  ▣ tmux sessions  ✉ Run inbox  ≡ workflow log  ⬢ pods, if a role needs one  ◉ live view</text></svg>
