<svg xmlns="http://www.w3.org/2000/svg" width="960" height="526" viewBox="0 0 960 526" role="img" aria-label="The core owns the mechanism: launching, worktrees, tmux sessions, the Run inbox, the workflow log, execution environments, the live view and the two core roles. A plugin is a directory of Markdown and TOML that owns how a team works: the example plugin's planner, worker and reviewer are 89 lines in all.">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .f { fill: #8b949e; animation: lit 9s infinite; }
    @keyframes lit { 0%, 8% { fill: #8b949e; } 3% { fill: #e6edf3; } }
    .plug { animation: plug 3s ease-in-out infinite; }
    @keyframes plug { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(-10px); } }
    .dash { stroke-dasharray: 5 6; animation: flow 1.2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -22; } }
  
    .cap{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:20px}@keyframes c0{0%{opacity:1}33.32%{opacity:1}33.33%{opacity:0}100%{opacity:0}}.c0{opacity:0;animation:c0 9s infinite}@keyframes c1{0%{opacity:0}33.32%{opacity:0}33.33%{opacity:1}66.66%{opacity:1}66.67%{opacity:0}100%{opacity:0}}.c1{opacity:0;animation:c1 9s infinite}@keyframes c2{0%{opacity:0}66.66%{opacity:0}66.67%{opacity:1}99.99%{opacity:1}100.00%{opacity:0}100%{opacity:0}}.c2{opacity:0;animation:c2 9s infinite}
  </style>

  <rect width="960" height="526" rx="16" fill="#0d1117"/>
  

  <!-- core -->
  <text class="sans" x="40" y="48" font-size="13" font-weight="700" fill="#8b949e" letter-spacing="1.5">THE CORE · ONE BINARY</text>
  <text class="sans" x="40" y="68" font-size="13" fill="#6e7681">owns the mechanism, never how a team works</text>
  <rect x="40" y="86" width="400" height="358" rx="12" fill="#161b22" stroke="#30363d"/>
  <g font-size="13">
    <text x="64" y="122" fill="#e6edf3">▸ launch    <tspan fill="#6e7681">claude · codex backends</tspan></text>
    <text x="64" y="152" fill="#e6edf3">⎇ worktree  <tspan fill="#6e7681">one per Dispatch</tspan></text>
    <text x="64" y="182" fill="#e6edf3">▣ tmux      <tspan fill="#6e7681">one session per Dispatch</tspan></text>
    <text x="64" y="212" fill="#39c5cf">✉ Run inbox <tspan fill="#6e7681">files, one consumer</tspan></text>
    <text x="64" y="242" fill="#e6edf3">≡ workflow log <tspan fill="#6e7681">append-only JSONL</tspan></text>
    <text x="64" y="272" fill="#58a6ff">⬢ pods      <tspan fill="#6e7681">optional, from .devcontainer/</tspan></text>
    <text x="64" y="302" fill="#e6edf3">◉ live view <tspan fill="#6e7681">oat-agents tui</tspan></text>
  </g>
  <line x1="64" y1="324" x2="416" y2="324" stroke="#30363d"/>
  <text class="sans" x="64" y="350" font-size="12" fill="#6e7681">two core roles, and only two (ADR-0001)</text>
  <rect x="64" y="364" width="160" height="44" rx="8" fill="#1c1530" stroke="#d2a8ff"/>
  <text x="144" y="391" font-size="13" font-weight="700" fill="#d2a8ff" text-anchor="middle">oat-meta</text>
  <rect x="240" y="364" width="176" height="44" rx="8" fill="#161b22" stroke="#8b949e"/>
  <text x="328" y="391" font-size="13" font-weight="700" fill="#c9d1d9" text-anchor="middle">oat-console</text>

  <!-- socket -->
  <path d="M440 258 H 500" stroke="#d2a8ff" stroke-width="2" fill="none" class="dash"/>
  <g class="plug">
    <rect x="496" y="240" width="18" height="36" rx="4" fill="#d2a8ff"/>
  </g>

  <!-- plugin -->
  <text class="sans" x="530" y="48" font-size="13" font-weight="700" fill="#8b949e" letter-spacing="1.5">A PLUGIN · A DIRECTORY</text>
  <text class="sans" x="530" y="68" font-size="13" fill="#6e7681">owns how a team works; swap it, fork it, pin it</text>
  <rect x="530" y="86" width="390" height="358" rx="12" fill="#161b22" stroke="#d2a8ff" stroke-opacity=".5"/>
  <g font-size="13">
    <text x="554" y="120" fill="#e6edf3" font-weight="700">plugins/example/</text>
    <text x="554" y="146" class="f" style="animation-delay:0s">├─ oat-plugin.toml<tspan x="898" text-anchor="end" fill="#6e7681">3</tspan></text>
    <text x="554" y="170" fill="#c9d1d9">├─ core/</text>
    <text x="554" y="192" class="f" style="animation-delay:.5s">│  ├─ oat-meta-instruction.md<tspan x="898" text-anchor="end" fill="#6e7681">14</tspan></text>
    <text x="554" y="214" class="f" style="animation-delay:1s">│  └─ oat-console-instruction.md<tspan x="898" text-anchor="end" fill="#6e7681">5</tspan></text>
    <text x="554" y="238" fill="#c9d1d9">├─ roles/</text>
    <text x="554" y="260" class="f" font-size="12" style="animation-delay:1.5s">│  ├─ <tspan fill="#39c5cf">planner/</tspan>   role.toml · instructions.md<tspan x="898" text-anchor="end" fill="#6e7681">18</tspan></text>
    <text x="554" y="282" class="f" font-size="12" style="animation-delay:2s">│  ├─ <tspan fill="#3fb950">worker/</tspan>    role.toml · instructions.md<tspan x="898" text-anchor="end" fill="#6e7681">21</tspan></text>
    <text x="554" y="304" class="f" font-size="12" style="animation-delay:2.5s">│  ├─ <tspan fill="#e3b341">reviewer/</tspan>  role.toml · instructions.md<tspan x="898" text-anchor="end" fill="#6e7681">18</tspan></text>
    <text x="554" y="326" font-size="12" fill="#d2a8ff">│  └─ <tspan font-weight="700">any-role/</tspan>  <tspan fill="#8b949e">tester, sec-auditor, doc-writer…</tspan></text>
    <text x="554" y="350" fill="#c9d1d9">└─ skills/</text>
    <text x="554" y="372" class="f" style="animation-delay:3s">   └─ committing/SKILL.md<tspan x="898" text-anchor="end" fill="#6e7681">10</tspan></text>
  </g>
  <line x1="554" y1="388" x2="896" y2="388" stroke="#30363d"/>
  <text x="554" y="412" font-size="14" font-weight="700" fill="#d2a8ff">the example team</text>
  <text x="898" y="412" font-size="14" font-weight="700" fill="#d2a8ff" text-anchor="end">89 lines</text>
  <text class="sans" x="554" y="430" font-size="11" fill="#6e7681">A new role is a new directory. No SDK, no code, no core edit.</text>
  <!-- caption -->
  <path d="M0 470H960V510Q960 526 944 526H16Q0 526 0 510Z" fill="#161b22"/><rect x="0" y="470" width="960" height="1" fill="#30363d"/><rect x=".5" y=".5" width="959" height="525" rx="16" fill="none" stroke="#30363d"/>
  <text class="cap c0" x="480" y="506" fill="#c9d1d9" text-anchor="middle">① The core is the same for every team: it launches, isolates, delivers and records</text><text class="cap c1" x="480" y="506" fill="#c9d1d9" text-anchor="middle">② A plugin says which roles exist and how they work: three in the example, any in yours</text><text class="cap c2" x="480" y="506" fill="#c9d1d9" text-anchor="middle">③ Change how your team works by editing a plugin file, never the core</text>
</svg>
